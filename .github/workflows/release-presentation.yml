name: Release Presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/**'
      - '.github/workflows/release-presentation.yml'
      - 'docs/assets/releases/**'
      - 'scripts/release_page.py'
      - 'scripts/tests/test_release_page.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-presentation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release presentation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Refresh latest release description
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_page.py --update-latest
